services:
  provisioning-render:
    image: ${ALPINE_IMAGE:-alpine:3.20}
    hostname: provisioning-render
    environment:
      MCP_ENABLED: ${MCP_ENABLED:-false}
    volumes:
      - type: bind
        source: ./jahia
        target: /source
        read_only: true
      - type: volume
        source: provisioning
        target: /output
    entrypoint: ["/bin/sh", "/source/render-provisioning.sh"]

  jahia:
    image: ${JAHIA_IMAGE:-achaabni/jahia-prism:0.2.0}
    hostname: jahia
    depends_on:
      postgres:
        condition: service_healthy
      provisioning-render:
        condition: service_completed_successfully
    ports:
      - "${JAHIA_HTTP_PORT:-8080}:8080"
      - "${JAHIA_DEBUG_PORT:-9229}:9229"
    environment:
      DB_VENDOR: postgresql
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-jahia}
      DB_USER: ${DB_USER:-jahia}
      DB_PASS: ${DB_PASS:-dbpassword}
      SUPER_USER_PASSWORD: ${SUPER_USER_PASSWORD}
      TZ : ${TIMEZONE}
      JPDA: ${JPDA:-true}
      MCP_API_TOKEN: ${MCP_API_TOKEN}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-mailpit}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-1025}
      EXECUTE_PROVISIONING_SCRIPT: "file:/provisioning/provisioning.yaml"
    volumes:
      - type: volume
        source: provisioning
        target: /provisioning
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8080/start"]
      interval: 5s
      timeout: 1s
      retries: 30
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jahia.rule=Host(`${JAHIA_HOST:-prism.localhost}`)"
      - "traefik.http.routers.jahia.entrypoints=websecure"
      - "traefik.http.routers.jahia.tls=true"
      - "traefik.http.routers.jahia.service=jahia-http"
      - "traefik.http.services.jahia-http.loadbalancer.server.port=8080"
      - "traefik.http.routers.jahia-redirect.rule=Host(`${JAHIA_HOST:-prism.localhost}`)"
      - "traefik.http.routers.jahia-redirect.entrypoints=web"
      - "traefik.http.routers.jahia-redirect.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    hostname: postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-jahia}
      POSTGRES_USER: ${DB_USER:-jahia}
      POSTGRES_PASSWORD: ${DB_PASS:-dbpassword}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-jahia}"]
      interval: 5s
      timeout: 1s
      retries: 30

  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:latest}
    hostname: mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025" # Web UI
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailpit.rule=Host(`${MAILPIT_HOST:-mailpit.localhost}`)"
      - "traefik.http.routers.mailpit.entrypoints=websecure"
      - "traefik.http.routers.mailpit.tls=true"
      - "traefik.http.services.mailpit-http.loadbalancer.server.port=8025"
      - "traefik.http.routers.mailpit-redirect.rule=Host(`${MAILPIT_HOST:-mailpit.localhost}`)"
      - "traefik.http.routers.mailpit-redirect.entrypoints=web"
      - "traefik.http.routers.mailpit-redirect.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

  reverse-proxy:
    image: ${TRAEFIK_IMAGE:-traefik:v3.7.6}
    hostname: reverse-proxy
    command:
      - --api=true
      - --api.disabledashboardad=true
      - --log.format=json
      - --log.level=INFO
      - --providers.docker
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entryPoints.websecure.http.tls=true
      - --providers.file.filename=/etc/traefik/tls.yaml
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_HOST:-traefik.localhost}`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.tls=true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/tls.yaml:/etc/traefik/tls.yaml:ro
      - ./traefik/certs:/etc/ssl/traefik:ro

volumes:
  provisioning:
